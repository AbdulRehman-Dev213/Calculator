<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Calculator</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="container">
            <div class="display-number">
                <div id="expression"></div>
                <output id="numberInput">0</output>
            </div>
            <section class="calculator-keypad">
                <button type="button" class="clear-button" data-action="Clear">C</button>
                <button type="button" class="delete-button" data-action="Delete">⌫</button>
                <button type="button" class="operator-button" data-value="/">÷</button>
                <button type="button" class="operator-button" data-value="*">×</button>

                <button type="button" class="number-button" data-value="7">7</button>
                <button type="button" class="number-button" data-value="8">8</button>
                <button type="button" class="number-button" data-value="9">9</button>
                <button type="button" class="operator-button" data-value="-">−</button>

                <button type="button" class="number-button" data-value="4">4</button>
                <button type="button" class="number-button" data-value="5">5</button>
                <button type="button" class="number-button" data-value="6">6</button>
                <button type="button" class="operator-button" data-value="+">+</button>

                <button type="button" class="number-button" data-value="1">1</button>
                <button type="button" class="number-button" data-value="2">2</button>
                <button type="button" class="number-button" data-value="3">3</button>
                <button type="button" class="equals-button" data-action="equals">=</button>

                <button type="button" class="number-button zero-button" data-value="0">0</button>
                <button type="button" class="number-button" data-value=".">.</button>
            </section>
        </div>
        <script src="script.js"></script>
    </body>
</html>
